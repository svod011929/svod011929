  <text x="36" y="116" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#C9D1D9">и VPN/серверную инфраструктуру.</text>
  <text x="36" y="156" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">Люблю чистую архитектуру, автоматизацию и системы,</text>
  <text x="36" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#8B949E">которые не разваливаются в 3 ночи.</text>
